# Runs on every pull request. Nothing here touches the app, the database, or
# Render — it is a throwaway container that downloads the code, tries to start
# it, and reports back.
#
# It exists because a change reached main that decorated a function with
# @shared_task 2,600 lines above the import of shared_task. A decorator runs at
# import time, so the name did not exist yet, and because tracker/urls.py
# imports every view module the whole URLconf failed to build — every endpoint
# returned 500. Typechecking cannot see that and no test catches it unless the
# suite imports the URLconf. `manage.py check` does, in about ten seconds.
#
# Advisory by design. GitHub shows a tick or a cross next to the merge button
# and nothing is blocked unless someone turns these into required checks in
# branch protection.
name: PR checks

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the previous run rather than queueing.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django imports and system check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # matches server/Dockerfile
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: manage.py check
        working-directory: server
        # Dummy values only. `check` imports settings and builds the URLconf; it
        # does not open a database connection, so these never have to be real —
        # and a CI job must never hold a credential it does not need.
        env:
          DJANGO_SECRET_KEY: ci-not-a-real-secret
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: python manage.py check

      - name: Migration graph is linear
        working-directory: server
        # Two PRs open at once, each adding a migration on the same parent,
        # neither able to see the other. Django then refuses to run ANY
        # migration — not just the new ones — so the next deploy that migrates
        # is blocked until someone lands a merge migration. That happened
        # three times in two days, and nothing caught it: `manage.py check`
        # does not build the migration graph, and the app runs fine right up
        # until something tries to migrate.
        #
        # Builds the graph from the files, asserts one leaf per app. No
        # database needed, about a second.
        env:
          DJANGO_SECRET_KEY: ci-not-a-real-secret
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: python manage.py verify_migration_graph

      - name: Celery tasks are registered
        working-directory: server
        # Two failure directions, same root cause: autodiscover_tasks() only
        # walks each app's `tasks` module, so a @shared_task defined anywhere
        # else is never registered on the worker.
        #
        # SCHEDULED BUT UNREGISTERED — beat sends it, the worker discards it.
        # tasks_mail.py spent four months here: sync_all_mail went out every
        # five minutes and nothing ran. Nothing in the app surfaced it.
        #
        # DECLARED BUT UNREGISTERED — nothing sends it yet, so nothing looks
        # broken. sync_clio_full sat here for a month with a docstring claiming
        # it ran on a schedule that did not exist, and the scheduled-vs-registry
        # comparison could not see it: there was no schedule entry to compare.
        # The audit that closes this immediately found a second one already in
        # the tree (cch_axcess).
        #
        # Both are mismatches a machine can see in about ten seconds.
        env:
          DJANGO_SECRET_KEY: ci-not-a-real-secret
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
        run: python manage.py verify_beat_tasks

  undefined-names:
    name: Python undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # matches server/Dockerfile

      - name: Install pyflakes
        run: pip install pyflakes==3.4.0

      - name: pyflakes (undefined names only)
        # A name that is never imported or defined is a NameError the moment
        # that line runs — and only then. `manage.py check` imports every
        # module but never calls the function, so it passes. That is how a
        # NameError took prod down (#649/#650), and how an undefined
        # AgentError in maybe_send_alert turned every critical agent error
        # report into a 500 and kept the alert email from ever sending.
        #
        # Only "undefined name" fails the job. pyflakes also reports hundreds
        # of unused / redefined imports that are pre-existing and harmless;
        # failing on those would make this red on every PR. pyflakes exits
        # non-zero for any finding, so its exit code is ignored and the grep
        # decides.
        run: |
          python -m pyflakes server/ mac_agent/ windows_agent/ > pyflakes.log 2>&1 || true
          # Anchored on the quote: pyflakes' star-import notice ("unable to
          # detect undefined names", server/settings_scratch.py) must not match.
          if grep -E ": undefined name '" pyflakes.log; then
            echo "::error::pyflakes found undefined names (above). Each is a NameError at call time."
            exit 1
          fi
          echo "no undefined names ($(wc -l < pyflakes.log) other pyflakes findings, not enforced)"

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: tsc --noEmit
        working-directory: frontend
        # `|| true` on purpose: main currently carries pre-existing type errors,
        # so a hard failure here would show a red cross on every PR regardless of
        # its contents and train everyone to ignore the result. This reports the
        # count. Drop the `|| true` once the baseline is zero.
        run: |
          npx tsc --noEmit 2>&1 | tee tsc.log || true
          echo "type errors: $(grep -c 'error TS' tsc.log || echo 0)"
