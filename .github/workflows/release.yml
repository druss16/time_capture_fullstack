name: Build and Release TimeTracker

on:
  push:
    tags:
      - 'v*'

env:
  ENABLE_WINDOWS_SIGNING: 'false'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Extract version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"
      
      - name: Write version file
        working-directory: mac_agent
        run: |
          echo "# Auto-generated during build - DO NOT EDIT" > version.py
          echo "APP_VERSION = \"$VERSION\"" >> version.py
          cat version.py
      
      - name: Install dependencies
        working-directory: mac_agent
        run: |
          pip install pyinstaller rumps pyobjc-framework-Cocoa pyobjc-framework-Quartz requests customtkinter certifi pynput
      
      - name: Build Mac app
        working-directory: mac_agent
        run: |
          pyinstaller --onedir --windowed --name "TimeTracker" \
            --osx-bundle-identifier "com.mavops.timetracker" \
            --hidden-import=customtkinter \
            --collect-all=customtkinter \
            --hidden-import=Quartz \
            --hidden-import=Quartz.CoreGraphics \
            --hidden-import=certifi \
            --collect-data=certifi \
            --hidden-import=pynput \
            --hidden-import=pynput.keyboard \
            --hidden-import=pynput.keyboard._darwin \
            main.py
      
      # ============================================================
      # SET VERSION IN INFO.PLIST (for Get Info display)
      # ============================================================
      - name: Update Info.plist with version
        working-directory: mac_agent
        run: |
          INFO_PLIST="dist/TimeTracker.app/Contents/Info.plist"
          
          # Set version strings (shows in Finder "Get Info")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$INFO_PLIST"
          
          # Set other metadata
          /usr/libexec/PlistBuddy -c "Set :CFBundleName TimeTracker" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName TimeTracker" "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright © 2024-2025 MavOps. Version $VERSION" "$INFO_PLIST" || true
          
          # Menu bar app (no dock icon)
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :LSUIElement true" "$INFO_PLIST"
          
          # Minimum macOS version
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 10.15.0" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 10.15.0" "$INFO_PLIST"
          
          # Accessibility/Automation descriptions (required for notarization)
          /usr/libexec/PlistBuddy -c "Add :NSAppleEventsUsageDescription string 'TimeTracker needs automation access to read window titles for time tracking.'" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAccessibilityUsageDescription string 'TimeTracker needs accessibility access to track which applications you use.'" "$INFO_PLIST" 2>/dev/null || true
          
          echo "=== Updated Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$INFO_PLIST" | head -30
      
      - name: Import signing certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          echo $MACOS_INSTALLER_CERTIFICATE | base64 --decode > installer.p12
          
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k build.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning build.keychain
      
      - name: Sign app
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        working-directory: mac_agent
        run: |
          echo "Signing all internal binaries first..."
          find dist/TimeTracker.app -type f \( -name "*.so" -o -name "*.dylib" \) -exec codesign --force --sign "$IDENTITY" --options runtime --timestamp {} \;
          
          find dist/TimeTracker.app -type f -name "Python*" -exec codesign --force --sign "$IDENTITY" --options runtime --timestamp {} \;
          
          codesign --force --sign "$IDENTITY" --options runtime --timestamp dist/TimeTracker.app/Contents/MacOS/TimeTracker
          
          echo "Signing app bundle..."
          codesign --force --deep --sign "$IDENTITY" --options runtime --timestamp dist/TimeTracker.app
          codesign --verify --verbose dist/TimeTracker.app
      
      # ============================================================
      # CREATE PKG INSTALLER
      # ============================================================
      - name: Create signed pkg installer
        env:
          IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        working-directory: mac_agent
        run: |
          echo "Packaging .app bundle into PKG..."
          pkgbuild --component dist/TimeTracker.app \
            --identifier com.mavops.timetracker \
            --version "$VERSION" \
            --install-location /Applications \
            unsigned.pkg
          
          productsign --sign "$IDENTITY" unsigned.pkg TimeTracker.pkg
          rm unsigned.pkg
          
          echo "=== PKG created ==="
          ls -la TimeTracker.pkg
      
      # ============================================================
      # CREATE DMG WITH APPLICATIONS SYMLINK (drag to install)
      # ============================================================
      - name: Create DMG installer
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        working-directory: mac_agent
        run: |
          echo "Creating DMG with Applications symlink..."
          
          # Create temp folder for DMG contents
          mkdir -p dmg_temp
          
          # Copy signed .app
          cp -R dist/TimeTracker.app dmg_temp/
          
          # Create Applications symlink (enables drag-to-install!)
          ln -s /Applications dmg_temp/Applications
          
          # Create DMG
          hdiutil create -volname "TimeTracker $VERSION" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "TimeTracker-$VERSION.dmg"
          
          # Sign DMG
          codesign --force --sign "$IDENTITY" "TimeTracker-$VERSION.dmg"
          
          # Cleanup
          rm -rf dmg_temp
          
          echo "=== DMG created ==="
          ls -la "TimeTracker-$VERSION.dmg"
      
      # ============================================================
      # NOTARIZE BOTH PKG AND DMG
      # ============================================================
      - name: Notarize PKG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        working-directory: mac_agent
        run: |
          echo "Notarizing PKG..."
          xcrun notarytool submit TimeTracker.pkg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json > pkg_notarization.json || true
          
          PKG_STATUS=$(cat pkg_notarization.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
          echo "PKG Status: $PKG_STATUS"
          
          if [ "$PKG_STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(cat pkg_notarization.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            echo "=== PKG NOTARIZATION LOG ==="
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi
          
          xcrun stapler staple TimeTracker.pkg
          echo "✓ PKG notarized and stapled"
      
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        working-directory: mac_agent
        run: |
          echo "Notarizing DMG..."
          xcrun notarytool submit "TimeTracker-$VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json > dmg_notarization.json || true
          
          DMG_STATUS=$(cat dmg_notarization.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
          echo "DMG Status: $DMG_STATUS"
          
          if [ "$DMG_STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(cat dmg_notarization.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
            echo "=== DMG NOTARIZATION LOG ==="
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi
          
          xcrun stapler staple "TimeTracker-$VERSION.dmg"
          echo "✓ DMG notarized and stapled"
      
      - name: Verify builds
        working-directory: mac_agent
        run: |
          echo "=== Verifying PKG ==="
          spctl --assess -v --type install TimeTracker.pkg
          
          echo ""
          echo "=== Verifying DMG ==="
          spctl --assess -v --type open "TimeTracker-$VERSION.dmg" || true
          
          echo ""
          echo "=== Version in app bundle ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/TimeTracker.app/Contents/Info.plist
      
      - name: Upload Mac PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-pkg-installer
          path: mac_agent/TimeTracker.pkg
      
      - name: Upload Mac DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-installer
          path: mac_agent/TimeTracker-*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: windows_agent
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Write version file
        working-directory: windows_agent
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "# Auto-generated during build - DO NOT EDIT" > version.py
          echo "APP_VERSION = \"$VERSION\"" >> version.py
          cat version.py

      - name: Build executables
        working-directory: windows_agent
        run: |
          python -m PyInstaller --onedir --windowed --name "TimeTracker" --hidden-import=customtkinter --collect-all=customtkinter --hidden-import=CTkMessagebox --collect-all=CTkMessagebox gui.py
          python -m PyInstaller --onedir --noconsole --name "TimeTrackerAgent" --hidden-import=timetracker_gui --add-data "timetracker_gui.py;." main.py
      
      - name: Sign Windows executables
        if: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: timetracker-signing
          certificate-profile-name: timetracker-profile
          files-folder: ${{ github.workspace }}/windows_agent/dist
          files-folder-filter: exe
          files-folder-recurse: false
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      
      - name: Get version without v prefix
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows_agent/installer.iss
          options: /DMyAppVersion=${{ env.VERSION }}
      
      - name: Sign Windows installer
        if: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: timetracker-signing
          certificate-profile-name: timetracker-profile
          files-folder: ${{ github.workspace }}/windows_agent/Output
          files-folder-filter: exe
          files-folder-recurse: false
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows_agent/Output/*.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      
      - name: Download Mac PKG artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-pkg-installer
          path: ./mac
      
      - name: Download Mac DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg-installer
          path: ./mac
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./windows
      
      - name: List artifacts
        run: |
          echo "=== Mac installers ==="
          ls -la ./mac/
          echo ""
          echo "=== Windows installers ==="
          ls -la ./windows/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          repository: druss16/timetracker-releases
          files: |
            ./mac/TimeTracker.pkg
            ./mac/TimeTracker-*.dmg
            ./windows/TimeTracker-Windows-Setup.exe
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.RELEASES_PAT }}
          make_latest: true
          body: |
            ## TimeTracker ${{ github.ref_name }}
            
            ### Downloads
            
            **Mac (choose one):**
            - `TimeTracker-${{ env.VERSION }}.dmg` - Drag to Applications to install (recommended)
            - `TimeTracker.pkg` - Double-click to install automatically
            
            **Windows:**
            - `TimeTracker-Windows-Setup.exe` - Run installer
            
            ### What's New
            - Version displays in Finder "Get Info"
            - DMG installer with drag-to-Applications
            - Re-link Device option in menu bar
            - Username displayed in menu bar dropdown