name: Build and Release TimeTracker

on:
  push:
    tags:
      - 'v*'

env:
  ENABLE_WINDOWS_SIGNING: 'false'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Write version file
        working-directory: mac_agent
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "# Auto-generated during build - DO NOT EDIT" > version.py
          echo "APP_VERSION = \"$VERSION\"" >> version.py
          cat version.py
      
      - name: Install dependencies
        working-directory: mac_agent
        run: |
          pip install pyinstaller rumps pyobjc-framework-Cocoa pyobjc-framework-Quartz requests customtkinter certifi pynput
      
      - name: Build Mac app
        working-directory: mac_agent
        run: |
          pyinstaller --onedir --windowed --name "TimeTracker" \
            --hidden-import=customtkinter \
            --collect-all=customtkinter \
            --hidden-import=Quartz \
            --hidden-import=Quartz.CoreGraphics \
            --hidden-import=certifi \
            --collect-data=certifi \
            --hidden-import=pynput \
            --hidden-import=pynput.keyboard \
            --hidden-import=pynput.keyboard._darwin \
            main.py
      
      - name: Import signing certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          echo $MACOS_INSTALLER_CERTIFICATE | base64 --decode > installer.p12
          
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k build.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning build.keychain
      
      - name: Sign app
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        working-directory: mac_agent
        run: |
          echo "Signing all internal binaries first..."
          find dist/TimeTracker.app -type f \( -name "*.so" -o -name "*.dylib" \) -exec codesign --force --sign "$IDENTITY" --options runtime --timestamp {} \;
          
          find dist/TimeTracker.app -type f -name "Python*" -exec codesign --force --sign "$IDENTITY" --options runtime --timestamp {} \;
          
          codesign --force --sign "$IDENTITY" --options runtime --timestamp dist/TimeTracker.app/Contents/MacOS/TimeTracker
          
          echo "Signing app bundle..."
          codesign --force --deep --sign "$IDENTITY" --options runtime --timestamp dist/TimeTracker.app
          codesign --verify --verbose dist/TimeTracker.app
      
      - name: Create signed pkg installer
        env:
          IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        working-directory: mac_agent
        run: |
          if [ -d "dist/TimeTracker.app" ]; then
            echo "Packaging .app bundle..."
            pkgbuild --component dist/TimeTracker.app --identifier com.mavops.timetracker --version ${{ github.ref_name }} --install-location /Applications unsigned.pkg
          else
            echo "Packaging standalone binary..."
            mkdir -p dist/pkg-root
            cp dist/TimeTracker dist/pkg-root/
            pkgbuild --root dist/pkg-root --identifier com.mavops.timetracker --version ${{ github.ref_name }} --install-location /usr/local/bin unsigned.pkg
          fi
          
          productsign --sign "$IDENTITY" unsigned.pkg TimeTracker.pkg
          rm unsigned.pkg
          
          echo "=== Package created ==="
          ls -la TimeTracker.pkg
      
      - name: Notarize pkg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        working-directory: mac_agent
        run: |
          xcrun notarytool submit TimeTracker.pkg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json > notarization_result.json || true
          
          SUBMISSION_ID=$(cat notarization_result.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          STATUS=$(cat notarization_result.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
          
          echo "Submission ID: $SUBMISSION_ID"
          echo "Status: $STATUS"
          
          if [ "$STATUS" != "Accepted" ]; then
            echo "=== NOTARIZATION LOG ==="
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          
          xcrun stapler staple TimeTracker.pkg
      
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: mac_agent/TimeTracker.pkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: windows_agent
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Write version file
        working-directory: windows_agent
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "# Auto-generated during build - DO NOT EDIT" > version.py
          echo "APP_VERSION = \"$VERSION\"" >> version.py
          cat version.py

      - name: Build executables
        working-directory: windows_agent
        run: |
          python -m PyInstaller --onedir --windowed --name "TimeTracker" --hidden-import=customtkinter --collect-all=customtkinter --hidden-import=CTkMessagebox --collect-all=CTkMessagebox gui.py
          python -m PyInstaller --onedir --noconsole --name "TimeTrackerAgent" --hidden-import=timetracker_gui --add-data "timetracker_gui.py;." main.py
      
      - name: Sign Windows executables
        if: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: timetracker-signing
          certificate-profile-name: timetracker-profile
          files-folder: ${{ github.workspace }}/windows_agent/dist
          files-folder-filter: exe
          files-folder-recurse: false
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      
      - name: Get version without v prefix
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows_agent/installer.iss
          options: /DMyAppVersion=${{ env.VERSION }}
      
      - name: Sign Windows installer
        if: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: timetracker-signing
          certificate-profile-name: timetracker-profile
          files-folder: ${{ github.workspace }}/windows_agent/Output
          files-folder-filter: exe
          files-folder-recurse: false
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows_agent/Output/*.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: ./mac
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./windows
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          repository: druss16/timetracker-releases
          files: |
            ./mac/TimeTracker.pkg
            ./windows/TimeTracker-Windows-Setup.exe
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.RELEASES_PAT }}
          make_latest: true