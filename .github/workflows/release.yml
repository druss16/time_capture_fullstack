name: Build and Release TimeTracker

on:
  push:
    tags:
      - 'v*'

env:
  ENABLE_WINDOWS_SIGNING: 'true'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Write version file
        working-directory: mac_agent
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "# Auto-generated during build - DO NOT EDIT" > version.py
          echo "APP_VERSION = \"$VERSION\"" >> version.py
          cat version.py
          sed -i '' "s/APP_VERSION = \"dev\"/APP_VERSION = \"$VERSION\"/" timetracker_gui.py
          grep "APP_VERSION" timetracker_gui.py | head -1
      
      - name: Install dependencies
        working-directory: mac_agent
        run: |
          pip install pyinstaller rumps pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-UserNotifications requests customtkinter certifi pynput

      - name: Build Mac app
        working-directory: mac_agent
        run: |
          pyinstaller --onedir --windowed --name "TimeTracker" \
            --icon timetracker.icns \
            --add-data "version.py:." \
            --add-data "timetracker_gui.py:." \
            --add-data "notifications.py:." \
            --add-data "agent_sync_integration.py:." \
            --add-data "quick_switcher.py:." \
            --hidden-import=timetracker_gui \
            --hidden-import=notifications \
            --hidden-import=agent_sync_integration \
            --hidden-import=quick_switcher \
            --hidden-import=customtkinter \
            --collect-all=customtkinter \
            --hidden-import=Quartz \
            --hidden-import=Quartz.CoreGraphics \
            --hidden-import=certifi \
            --collect-data=certifi \
            --hidden-import=pynput \
            --hidden-import=pynput.keyboard \
            --hidden-import=pynput.keyboard._darwin \
            --hidden-import=UserNotifications \
            --hidden-import=objc \
            --hidden-import=Foundation \
            --hidden-import=AppKit \
            --hidden-import=rumps \
            main.py

      - name: Update Info.plist with version
        working-directory: mac_agent
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          INFO_PLIST="dist/TimeTracker.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string © 2024-2025 MavOps" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :LSUIElement true" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppSleepDisabled bool true" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSAppSleepDisabled true" "$INFO_PLIST"
          echo "=== Info.plist version info ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"

      - name: Add LaunchAgent plist to app bundle
        working-directory: mac_agent
        run: |
          cat > dist/TimeTracker.app/Contents/Resources/com.mavops.timetracker.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.mavops.timetracker</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/Applications/TimeTracker.app/Contents/MacOS/TimeTracker</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <dict>
                  <key>SuccessfulExit</key>
                  <false/>
              </dict>
              <key>ProcessType</key>
              <string>Interactive</string>
              <key>ThrottleInterval</key>
              <integer>5</integer>
              <key>StandardOutPath</key>
              <string>/tmp/timetracker.stdout.log</string>
              <key>StandardErrorPath</key>
              <string>/tmp/timetracker.stderr.log</string>
          </dict>
          </plist>
          EOF
      
      - name: Import signing certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          echo $MACOS_INSTALLER_CERTIFICATE | base64 --decode > installer.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          security import installer.p12 -k build.keychain -P "$MACOS_INSTALLER_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" build.keychain
          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning build.keychain
      
      - name: Sign app
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        working-directory: mac_agent
        run: |
          find dist/TimeTracker.app -type f \( -name "*.so" -o -name "*.dylib" \) -exec codesign --force --sign "$IDENTITY" --options runtime --timestamp {} \;
          find dist/TimeTracker.app -type f -name "Python*" -exec codesign --force --sign "$IDENTITY" --options runtime --timestamp {} \;
          codesign --force --sign "$IDENTITY" --options runtime --timestamp dist/TimeTracker.app/Contents/MacOS/TimeTracker
          codesign --force --deep --sign "$IDENTITY" --options runtime --timestamp dist/TimeTracker.app
          codesign --verify --verbose dist/TimeTracker.app
      
      - name: Create signed pkg installer
        env:
          IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        working-directory: mac_agent
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p scripts
          cat > scripts/preinstall << 'SCRIPT'
          #!/bin/bash
          LOGGED_IN_USER=$(stat -f "%Su" /dev/console)
          LOGGED_IN_UID=$(id -u "$LOGGED_IN_USER" 2>/dev/null || echo "")
          if [ -n "$LOGGED_IN_USER" ] && [ "$LOGGED_IN_USER" != "root" ] && [ -n "$LOGGED_IN_UID" ]; then
              PLIST="/Users/$LOGGED_IN_USER/Library/LaunchAgents/com.mavops.timetracker.plist"
              sudo -u "$LOGGED_IN_USER" launchctl bootout "gui/$LOGGED_IN_UID" "$PLIST" 2>/dev/null || true
          fi
          pkill -9 -f "TimeTracker.app" 2>/dev/null || true
          sleep 2
          exit 0
          SCRIPT
          chmod +x scripts/preinstall

          cat > scripts/postinstall << 'SCRIPT'
          #!/bin/bash
          LOGGED_IN_USER=$(stat -f "%Su" /dev/console)
          LOGGED_IN_UID=$(id -u "$LOGGED_IN_USER" 2>/dev/null || echo "")
          if [ -n "$LOGGED_IN_USER" ] && [ "$LOGGED_IN_USER" != "root" ] && [ -n "$LOGGED_IN_UID" ]; then
              PLIST_SRC="/Applications/TimeTracker.app/Contents/Resources/com.mavops.timetracker.plist"
              PLIST_DST="/Users/$LOGGED_IN_USER/Library/LaunchAgents/com.mavops.timetracker.plist"
              sudo -u "$LOGGED_IN_USER" launchctl bootout "gui/$LOGGED_IN_UID" "$PLIST_DST" 2>/dev/null || true
              sleep 0.5
              mkdir -p "/Users/$LOGGED_IN_USER/Library/LaunchAgents"
              cp "$PLIST_SRC" "$PLIST_DST"
              chown "$LOGGED_IN_USER" "$PLIST_DST"
              chmod 644 "$PLIST_DST"
              sudo -u "$LOGGED_IN_USER" launchctl bootstrap "gui/$LOGGED_IN_UID" "$PLIST_DST"
          fi
          exit 0
          SCRIPT
          chmod +x scripts/postinstall

          pkgbuild --component dist/TimeTracker.app \
            --identifier com.mavops.timetracker \
            --version "$VERSION" \
            --install-location /Applications \
            --scripts scripts \
            unsigned.pkg
          productsign --sign "$IDENTITY" unsigned.pkg TimeTracker.pkg
          rm unsigned.pkg
          ls -la TimeTracker.pkg
      
      - name: Notarize pkg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        working-directory: mac_agent
        run: |
          xcrun notarytool submit TimeTracker.pkg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --output-format json > submit_result.json
          SUBMISSION_ID=$(cat submit_result.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")
          echo "Submission ID: $SUBMISSION_ID"
          for i in $(seq 1 20); do
            sleep 30
            RESULT=$(xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --output-format json)
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
            echo "Poll $i: $STATUS"
            if [ "$STATUS" = "Accepted" ]; then break; fi
            if [ "$STATUS" = "Invalid" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD"
              exit 1
            fi
          done
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization timed out"
            exit 1
          fi
          xcrun stapler staple TimeTracker.pkg
      
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: mac_agent/TimeTracker.pkg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: windows_agent
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Write version file
        working-directory: windows_agent
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "# Auto-generated during build - DO NOT EDIT" > version.py
          echo "APP_VERSION = \"$VERSION\"" >> version.py
          cat version.py

      - name: Build executables
        working-directory: windows_agent
        run: |
          # Build GUI
          # Build GUI
          python -m PyInstaller --onedir --windowed --name "TimeTracker" `
            --icon=timetracker.ico `
            --collect-all customtkinter `
            --collect-all CTkMessagebox `
            --hidden-import=customtkinter `
            --hidden-import=CTkMessagebox `
            gui.py

          # Build Agent
          python -m PyInstaller --onedir --noconsole --name "TimeTrackerAgent" `
            --icon=timetracker.ico `
            --hidden-import=timetracker_gui `
            --hidden-import=mdm_deploy `
            --hidden-import=version `
            --hidden-import=update_checker `
            --hidden-import=tax_software_constants `
            --hidden-import=explorer_watcher `
            --add-data "timetracker_gui.py;." `
            --add-data "mdm_deploy.py;." `
            --add-data "version.py;." `
            --add-data "update_checker.py;." `
            --add-data "tax_software_constants.py;." `
            --add-data "explorer_watcher.py;." `
            --add-data "timetracker.ico;." `
            main.py

          # Build Watchdog — onefile, runs standalone
          python -m PyInstaller --onefile --noconsole --name "tt_watchdog" `
            tt_watchdog.py

      # ── SIGN FIRST, ZIP SECOND ──────────────────────────────────
      # Critical: sign all exes before packaging into zip
      # Agents receive the zip via auto-update — must contain signed binaries

      - name: Sign all executables (pre-zip)
        if: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: timetracker-signing
          certificate-profile-name: timetracker-cert
          files-folder: ${{ github.workspace }}/windows_agent/dist
          files-folder-filter: exe
          files-folder-recurse: true
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── CREATE AUTO-UPDATE ZIP (contains signed binaries + tt_watchdog) ──
      - name: Create agent zip for auto-update
        working-directory: windows_agent
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path "Output"

          # Copy tt_watchdog.exe (onefile) into the agent folder so it zips together
          Copy-Item "dist\tt_watchdog.exe" "dist\TimeTrackerAgent\tt_watchdog.exe"

          # Verify both exist and are signed before zipping
          if (-not (Test-Path "dist\TimeTrackerAgent\TimeTrackerAgent.exe")) {
            Write-Error "TimeTrackerAgent.exe not found"
            exit 1
          }
          if (-not (Test-Path "dist\TimeTrackerAgent\tt_watchdog.exe")) {
            Write-Error "tt_watchdog.exe not found"
            exit 1
          }

          # Create zip with all agent files including watchdog
          Compress-Archive -Path "dist\TimeTrackerAgent\*" -DestinationPath "Output\TimeTrackerAgent-$VERSION.zip" -Force
          
          # Verify zip size (should be >10MB)
          $zipSize = (Get-Item "Output\TimeTrackerAgent-$VERSION.zip").Length
          Write-Host "Created TimeTrackerAgent-$VERSION.zip ($zipSize bytes)"
          if ($zipSize -lt 10MB) {
            Write-Error "Zip too small ($zipSize bytes) - something went wrong"
            exit 1
          }

      - name: Verify zip contents
        working-directory: windows_agent
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          $zip = "Output\TimeTrackerAgent-$VERSION.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [System.IO.Compression.ZipFile]::OpenRead($zip).Entries.Name
          Write-Host "=== Zip contents ==="
          $entries | ForEach-Object { Write-Host "  $_" }
          if ($entries -notcontains "TimeTrackerAgent.exe") {
            Write-Error "TimeTrackerAgent.exe missing from zip"
            exit 1
          }
          if ($entries -notcontains "tt_watchdog.exe") {
            Write-Error "tt_watchdog.exe missing from zip"
            exit 1
          }
          Write-Host "=== Zip verified OK ==="

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: windows_agent/Output/TimeTrackerAgent-*.zip

      - name: List dist contents
        working-directory: windows_agent
        run: |
          echo "=== dist/TimeTrackerAgent contents ==="
          dir dist\TimeTrackerAgent
          echo "=== Output contents ==="
          dir Output

      - name: Get version without v prefix
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows_agent/installer.iss
          options: /DMyAppVersion=${{ env.VERSION }}

      - name: Sign Windows installer
        if: ${{ env.ENABLE_WINDOWS_SIGNING == 'true' }}
        uses: azure/trusted-signing-action@v0.5.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: timetracker-signing
          certificate-profile-name: timetracker-cert
          files-folder: ${{ github.workspace }}/windows_agent/Output
          files-folder-filter: exe
          files-folder-recurse: true
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Generate SHA512 hashes
        working-directory: windows_agent
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          Write-Host "=== SHA512 HASHES ==="
          Write-Host "TimeTracker-Windows-Setup.exe:"
          (Get-FileHash "Output\TimeTracker-Windows-Setup.exe" -Algorithm SHA512).Hash
          Write-Host "TimeTrackerAgent.exe:"
          (Get-FileHash "dist\TimeTrackerAgent\TimeTrackerAgent.exe" -Algorithm SHA512).Hash
          Write-Host "tt_watchdog.exe:"
          (Get-FileHash "dist\tt_watchdog.exe" -Algorithm SHA512).Hash
          Write-Host "TimeTrackerAgent-$VERSION.zip:"
          (Get-FileHash "Output\TimeTrackerAgent-$VERSION.zip" -Algorithm SHA512).Hash

      - name: Package for Intune
        working-directory: windows_agent
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/master/IntuneWinAppUtil.exe" -OutFile IntuneWinAppUtil.exe
          New-Item -ItemType Directory -Force -Path intune-package
          Copy-Item "Output\TimeTracker-Windows-Setup.exe" "intune-package\"
          @'
          param([string]$OrgToken = "")
          if ($OrgToken) {
              $dir = Join-Path $env:APPDATA "TimeTracker"
              if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
              $cfg = @{}
              $cfgPath = Join-Path $dir "config.json"
              if (Test-Path $cfgPath) { try { $cfg = Get-Content $cfgPath | ConvertFrom-Json -AsHashtable } catch {} }
              $cfg["org_token"] = $OrgToken
              $cfg["api_base"] = "https://timetracker-api-k375.onrender.com/api"
              $cfg | ConvertTo-Json | Set-Content -Path $cfgPath -Encoding UTF8
          }
          Start-Process -FilePath (Join-Path $PSScriptRoot "TimeTracker-Windows-Setup.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -NoNewWindow
          '@ | Set-Content "intune-package\install_timetracker.ps1"
          .\IntuneWinAppUtil.exe -c intune-package -s install_timetracker.ps1 -o Output -q

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows_agent/Output/*.exe

      - name: Upload Intune artifact
        uses: actions/upload-artifact@v4
        with:
          name: intune-package
          path: windows_agent/Output/*.intunewin

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: ./mac
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./windows

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: ./windows

      - name: Download Intune artifact
        uses: actions/download-artifact@v4
        with:
          name: intune-package
          path: ./intune

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          repository: druss16/timetracker-releases
          files: |
            ./mac/TimeTracker.pkg
            ./windows/TimeTracker-Windows-Setup.exe
            ./windows/TimeTrackerAgent-*.zip
            ./intune/install_timetracker.intunewin
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.RELEASES_PAT }}
          make_latest: true