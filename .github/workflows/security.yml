name: Security Scan

# Runs on every push to main, every PR, and weekly on Sunday at 06:00 UTC
# Weekly run catches newly-disclosed CVEs in dependencies you haven't changed
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:  # allows manual trigger from Actions tab

permissions:
  contents: read
  security-events: write   # required for uploading SARIF results
  pull-requests: write     # required for PR comments

jobs:
  # ---------------------------------------------------------------------------
  # 1. Secret scanning - catches API keys, tokens, passwords in git history
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we scan past commits too

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false   # FAIL the build if a secret is found

  # ---------------------------------------------------------------------------
  # 2. Python SAST - bandit catches Django/Python security anti-patterns
  # ---------------------------------------------------------------------------
  python-sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit on Django backend
        run: |
          bandit -r . \
            -x ./venv,./node_modules,./.venv,./tests,./test,./migrations,./build,./dist \
            -ll \
            -f sarif \
            -o bandit-results.sarif || true

      - name: Upload bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('bandit-results.sarif') != ''
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  # ---------------------------------------------------------------------------
  # 3. Python dependency CVEs - pip-audit checks requirements.txt
  # ---------------------------------------------------------------------------
  python-deps:
    name: Python Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies (warn-only)
        # Reports CVEs but doesn't fail the build. We track these in a separate
        # backlog and address with planned dependency upgrade PRs (see ADR TBD).
        # Tighten back to --strict (without || true) once Django + agent deps
        # are on supported versions.
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || true
          fi
          if [ -f server/requirements.txt ]; then
            pip-audit -r server/requirements.txt || true
          fi
          if [ -f agent/requirements.txt ]; then
            pip-audit -r agent/requirements.txt || true
          fi

  # ---------------------------------------------------------------------------
  # 4. JS/TS dependency CVEs - npm audit on React frontend & React Native app
  # --audit-level=critical means we ONLY fail on critical CVEs.
  # React Native especially has a long tail of high/moderate transitive vulns
  # that don't actually expose your app. Tighten to "high" once cleaned up.
  # ---------------------------------------------------------------------------
  js-deps:
    name: JS Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: ['frontend', 'mobile']
    steps:
      - uses: actions/checkout@v4

      - name: Check if path exists
        id: check
        run: |
          if [ -d "${{ matrix.path }}" ] && [ -f "${{ matrix.path }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit (warn-only)
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.path }}
        # Don't fail the build on npm audit findings - just report them.
        # Why: npm audit has a high false-positive rate for transitive deps,
        # especially in React Native. Review findings via the workflow logs.
        # Tighten this to fail on critical once you've triaged the noise.
        run: npm audit --audit-level=critical || true

  # ---------------------------------------------------------------------------
  # 5. Semgrep - multi-language SAST with Django/React/security rule packs
  # ---------------------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep with security rulesets
        run: |
          semgrep ci \
            --config=p/default \
            --config=p/django \
            --config=p/react \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --sarif --output=semgrep-results.sarif || true
        env:
          SEMGREP_RULES: p/default p/django p/react p/owasp-top-ten p/secrets

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # 6. CodeQL - GitHub's deep semantic analysis
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"