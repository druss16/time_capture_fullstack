# .pre-commit-config.yaml
#
# Install once:
#   pip install pre-commit
#   pre-commit install
#
# Then every `git commit` will run these checks automatically.
# The most important one for you is gitleaks — stops a Stripe key from
# ever leaving your laptop.

repos:
  # ---------- Secret detection ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------- Generic safety ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key       # SSH/PEM keys
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]         # 1 MB cap; agent binaries shouldn't go in git
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ---------- Python SAST ----------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ['-ll', '--skip', 'B101']   # B101 = assert_used; harmless in tests
        exclude: ^(tests/|migrations/|.*/migrations/)

  # ---------- Semgrep (lighter ruleset for pre-commit speed) ----------
  - repo: https://github.com/semgrep/semgrep
    rev: v1.95.0
    hooks:
      - id: semgrep
        args: ['--config=p/secrets', '--config=p/django', '--error']
