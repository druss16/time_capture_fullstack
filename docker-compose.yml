# docker-compose.yml
# tip: the `version:` key is deprecated; omitting it silences the warning.

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: time_api
    env_file:
      - ./server/.env
    ports:
      - "7123:7123"
    volumes:
      - ./server:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:7123"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: time_worker
    env_file:
      - ./server/.env
    depends_on:
      - api
      - redis
    command: python -m celery -A timeserver.celery_app worker -l info --concurrency=2
    restart: unless-stopped

  beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: time_beat
    env_file:
      - ./server/.env
    depends_on:
      - api
      - redis
    command: python -m celery -A timeserver.celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: time_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: time_web
    env_file:
      - ./frontend/.env
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE=http://localhost:7123
    volumes:
      - ./frontend:/usr/src/app
    command: npm run dev -- --host --port 5174
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  redisdata: